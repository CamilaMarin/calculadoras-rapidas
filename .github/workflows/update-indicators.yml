name: Update official indicators

on:
  schedule:
    - cron: "20 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-indicators.mjs
        env:
          BCCH_API_TOKEN: ${{ secrets.BCCH_API_TOKEN }}
      - name: Commit updated indicators
        run: |
          if git diff --quiet -- public/indicators.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/indicators.json
          git commit -m "chore: update official indicators"
          git push
